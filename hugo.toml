baseURL = "https://ashtonjdavey.github.io/"
title = "Dellinger Davey Blog"
theme = "hugo-theme-cleanwhite"
locale = "en-us"
preserveTaxonomyNames = true

[pagination]
  pagerSize = 5

[params]
  header_image = "img/hero-italy.jpg"
  SEOTitle = "Dellinger Davey Blog"
  description = "Personal blog"
  slogan = "TODO: your tagline here"
  upstreamAttribution = false

  image_404 = "img/404-bg.jpg"
  title_404 = "Page not found :("
  omit_categories = false

  page_view_counter = false
  algolia_search = false

  # Sidebar settings
  sidebar_about_description = "PhD student in Biomedical Informatics, CCHMC & University of Cincinnati"
  sidebar_avatar = "img/avatar.jpg"

  featured_tags = true
  featured_condition_size = 1

  friends = false
  bookmarks = false
  about_me = true

  last_posts = true

  [params.social]
  rss    = true
  email  = "youremail@example.com"
  github = "https://github.com/ashtonjdavey"

  [[params.additional_menus]]
  title = "ARCHIVE"
  href  = "/archive/"
  [[params.additional_menus]]
  title = "ABOUT"
  href  = "/about/"

[markup]
  [markup.tableOfContents]
    endLevel = 2
    startLevel = 1
  [markup.highlight]
    style = "dracula"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
